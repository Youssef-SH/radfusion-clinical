config_version: 1
name: metadata_lightgbm
executable: true

dataset:
  registry_key: rsna
  manifest_directory: data/manifests
  task_id: pneumonia

model:
  registry_key: metadata_lightgbm
  output_name: metadata_lightgbm
  modality: metadata
  class_weighting: train_class_ratio
  parameters:
    objective: binary
    n_estimators: 500
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.90
    subsample_freq: 1
    colsample_bytree: 0.90
    reg_lambda: 1.0
    verbosity: -1
  fit_parameters:
    early_stopping_rounds: 50
    eval_metric: average_precision

training:
  seed: 42
  report_directory: reports
  model_directory: models/rsna
  require_clean_git: true

evaluation:
  threshold_policy: youden_j
  sensitivity_target: 0.90
  calibration_bins: 15
  latency_warmup_calls: 100
  latency_measured_calls: 1000

mlflow:
  experiment_name: radfusion-rsna
  tracking_directory: mlruns
