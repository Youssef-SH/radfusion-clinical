[project]
name = "radfusion-clinical"
version = "0.1.0"
description = "DICOM-native multimodal clinical AI benchmark for pneumonia diagnosis support."
readme = "README.md"
authors = [
    { name = "Youssef-SH", email = "youssef.shili.contact@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pyarrow>=25.0.0",
    "pydicom>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radfusion"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pydicom-data>=1.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
